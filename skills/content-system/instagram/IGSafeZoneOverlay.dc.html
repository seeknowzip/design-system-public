<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ visible }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ isStory }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;left:0;right:0;height:13.02%;background:var(--status-negative);opacity:0.22;display:flex;align-items:center;justify-content:center;text-align:center">
<div style="font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--static-white);line-height:1.3;padding:0 8px">TOP 250px<br />프로필·팔로우 UI</div>
</div>
<div style="position:absolute;bottom:0;left:0;right:0;height:13.02%;background:var(--status-negative);opacity:0.22;display:flex;align-items:center;justify-content:center;text-align:center">
<div style="font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--static-white);line-height:1.3;padding:0 8px">BOTTOM 250px<br />답장·이모지 UI</div>
</div>
</sc-if>
<sc-if value="{{ isReels }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;left:0;right:0;height:13.02%;background:var(--status-negative);opacity:0.22;display:flex;align-items:center;justify-content:center;text-align:center">
<div style="font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--static-white);line-height:1.3;padding:0 8px">TOP 250px<br />프로필 헤더</div>
</div>
<div style="position:absolute;bottom:0;left:0;right:11.11%;height:17.7%;background:var(--status-negative);opacity:0.22;display:flex;align-items:center;justify-content:center;text-align:center">
<div style="font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--static-white);line-height:1.3;padding:0 8px">BOTTOM 340px<br />캡션·계정명·오디오</div>
</div>
<div style="position:absolute;bottom:0;top:13.02%;right:0;width:11.11%;background:var(--status-negative);opacity:0.22;display:flex;align-items:center;justify-content:center;text-align:center">
<div style="font-family:var(--font-mono);font-size:8px;font-weight:600;color:var(--static-white);line-height:1.25;writing-mode:vertical-rl">RIGHT 120px · 좋아요·댓글·공유</div>
</div>
</sc-if>
<sc-if value="{{ isCarousel }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:3.7%;box-shadow:0 0 0 1.5px var(--status-negative)"></div>
<div style="position:absolute;top:3.7%;left:3.7%;background:var(--status-negative);color:var(--static-white);font-family:var(--font-mono);font-size:9px;font-weight:600;padding:3px 6px;transform:translateY(-100%)">SAFE 1000×1000</div>
</sc-if>
<sc-if value="{{ isFeed }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;left:0;right:0;height:10%;background:var(--status-negative);opacity:0.18"></div>
<div style="position:absolute;bottom:0;left:0;right:0;height:10%;background:var(--status-negative);opacity:0.18"></div>
<div style="position:absolute;top:2.96%;left:3.7%;background:var(--status-negative);color:var(--static-white);font-family:var(--font-mono);font-size:9px;font-weight:600;padding:3px 6px">프로필 그리드 크롭 영역 (1080×1080)</div>
</sc-if>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'story';
    return {
      visible: this.props.visible ?? false,
      isStory: kind === 'story',
      isReels: kind === 'reels',
      isCarousel: kind === 'carousel',
      isFeed: kind === 'feed',
    };
  }
}
</script>
</body>
</html>
